name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # 16 matches the pg_dump client preinstalled on ubuntu-24.04 (used by the backup tests).
        image: postgres:16
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms-ci-password
          POSTGRES_DB: lms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnop
      DJANGO_DEBUG: "False"
      DB_NAME: lms
      DB_USER: lms
      DB_PASSWORD: lms-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      LMS_LOG_FORMAT: text
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Lock files match requirements*.txt
        run: python lock_requirements.py --check
      - name: Lint (ruff)
        run: ruff check .
      - name: Django system checks
        run: python manage.py check
      - name: Deploy checklist (HTTPS-only warnings are expected until a server exists)
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Download the WASM Python runtime (enables sandbox tests)
        run: python manage.py setup_code_runner
      - name: Tests
        run: python manage.py test --settings=config.test_settings --noinput
      - name: Dependency vulnerability audit
        # Blocking: a newly published CVE in a locked version fails the build until the lock is updated.
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Translations complete, no raw Russian UI text
        run: npm run check:i18n
      - name: Design tokens only (no raw colors, font sizes or !important)
        run: npm run check:css
      - run: npm run build
      - name: Audit packages shipped to the browser (blocking)
        run: npm audit --audit-level=high --omit=dev
      - name: Audit build tooling (report only; picomatch has no fixed release yet)
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    # UI smoke suite with the UI audit (overflow, raw values, console/HTTP errors, axe) on the
    # isolated QA data set. The long multi-width/multi-language sweep (npm run e2e:sweep) stays manual.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms-ci-password
          POSTGRES_DB: lms_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.qa_settings
      DB_USER: lms
      DB_PASSWORD: lms-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      LMS_LOG_FORMAT: text
      E2E_CHANNEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend with QA data
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          python manage.py setup_code_runner
          python manage.py migrate --noinput
          python manage.py seed_qa
          nohup python manage.py runserver 127.0.0.1:8100 --noreload > ../backend-e2e.log 2>&1 &
      - name: Frontend dev server and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          VITE_API_TARGET=http://127.0.0.1:8100 nohup npx vite --host 127.0.0.1 --port 5174 --strictPort > ../vite-e2e.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5174/api/health/ >/dev/null && break; sleep 2; done
      - name: UI smoke suite
        working-directory: frontend
        run: npm run e2e
      - name: Server logs on failure
        if: failure()
        run: tail -n 80 backend-e2e.log vite-e2e.log

