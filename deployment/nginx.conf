map $uri $auth_limit_key {
    default "";
    ~^/api/auth/(login|register|password-reset)/$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_requests:10m rate=5r/s;
# Docker DNS, re-resolved every 10 s: a recreated web container gets a new IP,
# and a name fixed at startup would answer 502 until Nginx restarts.
resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 105m;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    set $web_upstream http://web:8000;
    location /api/ {
        limit_req zone=auth_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }
    location /admin/ { return 404; }
    location ~ /\. { return 404; }
    location /media/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
